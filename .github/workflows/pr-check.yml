name: PR Validation

on:
  # OAK is in maintenance mode. Both auto-triggers were removed and the
  # validation jobs were stripped because upstream dependency drift
  # (e.g. agent-client-protocol breaking changes) makes the historical
  # checks unreliable. The workflow remains here to keep the badge green
  # while the project is frozen and can be invoked manually if revived.
  workflow_dispatch: {}

jobs:
  maintenance-status:
    name: Maintenance Mode
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Note status
        run: |
          echo "OAK is in maintenance mode."
          echo "Active development continues at https://github.com/goondocks-co/myco"
          echo "Migration guide: https://github.com/goondocks-co/myco/blob/main/docs/migrating-from-oak.md"
